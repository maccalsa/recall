name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (example: v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-22.04
            bundles: deb,appimage
            artifact_name: recall-linux-bundles
            upload_paths: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.appimage
          - name: macos
            os: macos-latest
            bundles: dmg
            artifact_name: recall-macos-bundles
            upload_paths: |
              src-tauri/target/release/bundle/dmg/*.dmg

    steps:
      - name: Checkout (release trigger ref)
        if: github.event_name == 'release'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve manual tag ref
        if: github.event_name == 'workflow_dispatch'
        id: resolve_tag
        shell: bash
        run: |
          set -euo pipefail
          INPUT_TAG="${{ inputs.tag }}"
          CANDIDATE_A="$INPUT_TAG"
          CANDIDATE_B="$INPUT_TAG"

          if [[ "$INPUT_TAG" == v* ]]; then
            CANDIDATE_B="${INPUT_TAG#v}"
          else
            CANDIDATE_B="v${INPUT_TAG}"
          fi

          if git rev-parse -q --verify "refs/tags/${CANDIDATE_A}" >/dev/null; then
            RESOLVED_TAG="$CANDIDATE_A"
          elif git rev-parse -q --verify "refs/tags/${CANDIDATE_B}" >/dev/null; then
            RESOLVED_TAG="$CANDIDATE_B"
          else
            echo "Could not find a tag matching '${INPUT_TAG}' or '${CANDIDATE_B}'."
            echo "Available tags:"
            git tag --list | tail -n 50
            exit 1
          fi

          echo "Resolved tag: ${RESOLVED_TAG}"
          echo "resolved_tag=${RESOLVED_TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout resolved manual tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          git checkout --force "refs/tags/${{ steps.resolve_tag.outputs.resolved_tag }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      - name: Install JS dependencies
        run: npm ci

      - name: Build Tauri app bundles
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.upload_paths }}
          if-no-files-found: error

      - name: Attach assets to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.upload_paths }}

      - name: Create or update release (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.resolved_tag }}
          files: ${{ matrix.upload_paths }}
